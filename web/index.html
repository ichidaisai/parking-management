<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ログイン</title>
    <link rel="stylesheet" href="/lib/dads-components-bundle.css" />
    <script src="/lib/dads-components-bundle.js"></script>
    <link rel="stylesheet" href="/auth.css" />
    <script type="module" src="/js/auth.mjs"></script>
    <style>
      body {
        font-family: "Noto Sans JP", sans-serif;
        max-width: 38rem;
        padding: 2rem;
        margin: auto;
      }

      .container {
        margin-top: 2rem;
      }
      .container > * {
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>システム</h1>
    <p id="auth-error" class="auth-error" role="alert" tabindex="-1" hidden></p>
    <form id="login-form" class="container">
      <p>登録済みのパスキーを選択してログインしてください。</p>
      <button
        type="submit"
        class="dads-button"
        data-size="lg"
        data-type="solid-fill"
        style="width: 100%"
      >
        パスキーでログイン
      </button>
    </form>
    <div class="container">
      <hr
        class="dads-divider"
        data-color="solid-gray-420"
        data-style="solid"
        data-width="1"
      />
      <a
        href="/register/"
        class="dads-button auth-link"
        data-size="lg"
        data-type="outline"
      >
        新規登録
      </a>
    </div>
  </body>
</html>
