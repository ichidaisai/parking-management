<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新規登録</title>
    <link rel="stylesheet" href="/lib/dads-components-bundle.css" />
    <script src="/lib/dads-components-bundle.js"></script>
    <link rel="stylesheet" href="/auth.css" />
    <script type="module" src="/js/auth.mjs"></script>
    <style>
      body {
        font-family: "Noto Sans JP", sans-serif;
        max-width: 38rem;
        padding: 2rem;
        margin: auto;
      }

      .container {
        margin-top: 2rem;
      }
      .container > * {
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>新規登録</h1>
    <div class="container">
      <div
        class="dads-step-navigation"
        data-orientation="horizontal"
        data-size="normal"
        style="--_width: 320; --_step-min-width: 160"
      >
        <p class="dads-u-visually-hidden">
          全2ステップ中、1ステップ目まで到達済み
        </p>
        <ul>
          <li
            class="dads-step-navigation__step"
            data-state="reached"
            data-first
            aria-current="true"
          >
            <span class="dads-step-navigation__header">
              <span class="dads-u-visually-hidden">ステップ</span>
              <span class="dads-step-navigation__number">1</span>
              <span class="dads-step-navigation__title">アカウント作成</span>
            </span>
            <p class="dads-step-navigation__description">
              招待コードを照合し、パスキーを設定します
            </p>
          </li>
          <li class="dads-step-navigation__step" data-last>
            <span class="dads-step-navigation__header">
              <span class="dads-u-visually-hidden">ステップ</span>
              <span class="dads-step-navigation__number">2</span>
              <span class="dads-step-navigation__title">完了</span>
            </span>
            <p class="dads-step-navigation__description">
              パスキーが正常に設定されました
            </p>
          </li>
        </ul>
      </div>
    </div>
    <p id="auth-error" class="auth-error" role="alert" tabindex="-1" hidden></p>
    <form id="register-form" class="container">
      <div class="dads-form-control-label" data-size="md">
        <label class="dads-form-control-label__label" for="invitation-code">
          招待コード
          <span
            class="dads-form-control-label__requirement"
            data-required="true"
            >※必須</span
          >
        </label>
        <div>
          <span class="dads-input-text">
            <input
              id="invitation-code"
              name="invitation_code"
              class="dads-input-text__input"
              type="text"
              required
              maxlength="256"
              autocomplete="off"
              autocapitalize="none"
              spellcheck="false"
              style="width: 100%"
              data-size="md"
            />
          </span>
        </div>
        <div class="dads-form-control-label" data-size="md">
          <label class="dads-form-control-label__label" for="name-input">
            ニックネーム
            <span
              class="dads-form-control-label__requirement"
              data-required="true"
              >※必須</span
            >
          </label>
          <div>
            <span class="dads-input-text">
              <input
                id="name-input"
                name="username"
                class="dads-input-text__input"
                type="text"
                required
                maxlength="100"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                aria-describedby="username-help"
                data-size="md"
                style="width: 100%"
              />
            </span>
          </div>
          <p id="username-help">
            100文字以内の文字・数字・_・.・-を使用できます。メールアドレスは使用できません。
          </p>
        </div>
      </div>
      <button
        type="submit"
        class="dads-button"
        data-size="lg"
        data-type="solid-fill"
        style="width: 100%"
      >
        パスキーを登録する
      </button>
    </form>
    <a href="/">ログイン画面に戻る</a>
  </body>
</html>
