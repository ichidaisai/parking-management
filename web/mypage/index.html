<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>マイページ</title>
    <link rel="stylesheet" href="/lib/dads-components-bundle.css" />
    <script src="/lib/dads-components-bundle.js"></script>
    <link rel="stylesheet" href="/auth.css" />
    <script type="module" src="/js/auth.mjs"></script>
    <style>
      body {
        font-family: "Noto Sans JP", sans-serif;
        max-width: 38rem;
        padding: 2rem;
        margin: auto;
      }

      .container {
        margin-top: 2rem;
      }
      .container > * {
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body data-page="mypage">
    <h1>マイページ</h1>
    <p id="auth-error" class="auth-error" role="alert" tabindex="-1" hidden></p>
    <div id="account-content" class="container" hidden>
      <p><strong id="username"></strong> さん、ログインしています。</p>
      <button
        id="logout-button"
        type="button"
        class="dads-button"
        data-size="lg"
        data-type="outline"
        style="width: 100%"
      >
        ログアウト
      </button>
    </div>
  </body>
</html>
