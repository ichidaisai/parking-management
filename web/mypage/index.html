<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>マイページ</title>
    <link rel="icon" href="/images/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/images/touch-icon.png" />
    <link rel="stylesheet" href="/lib/dads-components-bundle.css" />
    <script src="/lib/dads-components-bundle.js"></script>
    <link rel="stylesheet" href="/auth.css?v=17" />
    <script type="module" src="/js/auth.mjs?v=12"></script>
    <style>
      body {
        font-family: "Noto Sans JP", sans-serif;
      }

      .page {
        max-width: 38rem;
        padding: 1.5rem 1rem;
        margin: auto;
      }

      .container {
        margin-top: 2rem;
      }
      .container > * {
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body data-page="mypage">
    <div class="page">
      <h1>マイページ</h1>
      <p id="auth-error" class="auth-error" role="alert" tabindex="-1" hidden></p>
      <div id="account-content" class="container" hidden>
        <p><strong id="username"></strong> さん、ログインしています。</p>

        <div class="parking-list">
          <div class="parking-row parking-list-header">
            <span>駐車場名</span>
            <span class="parking-counts">空き</span>
          </div>
          <div class="parking-row" data-parking-id="parking-1">
            <span class="parking-name">第1駐車場</span>
            <span class="parking-counts">
              <span class="parking-count" data-kind="general" data-max="65">一般<output class="parking-count-value" aria-live="polite">-</output>台</span>
            </span>
            <button type="button" class="dads-button parking-change-button" data-size="md" data-type="outline">変更</button>
          </div>
          <div class="parking-row" data-parking-id="parking-3">
            <span class="parking-name">第3駐車場</span>
            <span class="parking-counts">
              <span class="parking-count" data-kind="general">一般<output class="parking-count-value" aria-live="polite">-</output>台</span>
            </span>
            <button type="button" class="dads-button parking-change-button" data-size="md" data-type="outline">変更</button>
          </div>
          <div class="parking-row" data-parking-id="parking-4">
            <span class="parking-name">第4駐車場</span>
            <span class="parking-counts">
              <span class="parking-count" data-kind="general" data-max="40">一般<output class="parking-count-value" aria-live="polite">-</output>台</span>
              <span class="parking-count" data-kind="accessible" data-max="4">身障<output class="parking-count-value" aria-live="polite">-</output>台</span>
            </span>
            <button type="button" class="dads-button parking-change-button" data-size="md" data-type="outline">変更</button>
          </div>
          <div class="parking-row" data-parking-id="track-field">
            <span class="parking-name">トラック&amp;フィールド駐車場</span>
            <span class="parking-counts">
              <span class="parking-count" data-kind="general">一般<output class="parking-count-value" aria-live="polite">-</output>台</span>
            </span>
            <button type="button" class="dads-button parking-change-button" data-size="md" data-type="outline">変更</button>
          </div>
          <div class="parking-row" data-parking-id="dormitory">
            <span class="parking-name">寮内駐車場</span>
            <span class="parking-counts">
              <span class="parking-count" data-kind="general" data-max="40">一般<output class="parking-count-value" aria-live="polite">-</output>台</span>
            </span>
            <button type="button" class="dads-button parking-change-button" data-size="md" data-type="outline">変更</button>
          </div>
          <div class="parking-row" data-parking-id="library-rear">
            <span class="parking-name">図書館裏駐車場</span>
            <span class="parking-counts">
              <span class="parking-count" data-kind="general" data-max="65">一般<output class="parking-count-value" aria-live="polite">-</output>台</span>
              <span class="parking-count" data-kind="accessible" data-max="2">身障<output class="parking-count-value" aria-live="polite">-</output>台</span>
            </span>
            <button type="button" class="dads-button parking-change-button" data-size="md" data-type="outline">変更</button>
          </div>
          <div class="parking-row" data-parking-id="campus-road">
            <span class="parking-name">構内道路駐車場</span>
            <span class="parking-counts">
              <span class="parking-count" data-kind="general">一般<output class="parking-count-value" aria-live="polite">-</output>台</span>
            </span>
            <button type="button" class="dads-button parking-change-button" data-size="md" data-type="outline">変更</button>
          </div>
          <div class="parking-row" data-parking-id="gym-rear">
            <span class="parking-name">体育館裏駐車場</span>
            <span class="parking-counts">
              <span class="parking-count" data-kind="general">一般<output class="parking-count-value" aria-live="polite">-</output>台</span>
            </span>
            <button type="button" class="dads-button parking-change-button" data-size="md" data-type="outline">変更</button>
          </div>
        </div>

        <img class="parking-map" src="/images/parking-map.webp" alt="広島市立大学 施設配置図" width="1279" height="904" loading="lazy" />

        <dialog id="parking-count-dialog" class="dads-modal-dialog" aria-labelledby="parking-count-title">
          <form id="parking-count-form" class="dads-modal-dialog__dialog">
            <div class="dads-modal-dialog__header">
              <h2 id="parking-count-title" class="dads-modal-dialog__heading">第1駐車場</h2>
            </div>

            <div class="dads-modal-dialog__body parking-counters">
              <div class="parking-counter" data-kind="general">
                <span class="parking-counter-label">一般</span>
                <button type="button" class="dads-button" data-size="sm" data-type="outline" data-step="-1" aria-label="一般を1台減らす">−</button>
                <output class="parking-counter-value" aria-live="polite" aria-label="一般の台数">0</output>
                <button type="button" class="dads-button" data-size="sm" data-type="outline" data-step="1" aria-label="一般を1台増やす">＋</button>
              </div>
              <div class="parking-counter" data-kind="accessible">
                <span class="parking-counter-label">身障</span>
                <button type="button" class="dads-button" data-size="sm" data-type="outline" data-step="-1" aria-label="身障を1台減らす">−</button>
                <output class="parking-counter-value" aria-live="polite" aria-label="身障の台数">0</output>
                <button type="button" class="dads-button" data-size="sm" data-type="outline" data-step="1" aria-label="身障を1台増やす">＋</button>
              </div>
            </div>

            <div class="dads-modal-dialog__actions parking-dialog-actions">
              <button id="parking-count-cancel" type="button" class="dads-button" data-size="md" data-type="outline">キャンセル</button>
              <button id="parking-count-save" type="submit" class="dads-button" data-size="md" data-type="solid-fill">保存</button>
            </div>
          </form>
        </dialog>

        <button
          id="logout-button"
          type="button"
          class="dads-button"
          data-size="lg"
          data-type="outline"
          style="width: 100%"
        >
          ログアウト
        </button>
      </div>
    </div>
  </body>
</html>
